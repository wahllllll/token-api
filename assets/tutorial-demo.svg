<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">编辑器 API 配置示例</title>
  <desc id="desc">展示在编辑器设置中填写接口地址、API Key 和模型名称。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ef"/><stop offset="1" stop-color="#f3e8dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#76533d" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="150" fill="#efc6a4" opacity=".24"/>
  <circle cx="120" cy="640" r="190" fill="#c5d7cf" opacity=".28"/>
  <g filter="url(#shadow)">
    <rect x="110" y="72" width="980" height="576" rx="24" fill="#fffdf9" stroke="#dccbbb"/>
    <rect x="110" y="72" width="980" height="58" rx="24" fill="#392f2a"/>
    <path d="M110 106h980v24H110z" fill="#392f2a"/>
    <circle cx="147" cy="101" r="7" fill="#e8785e"/><circle cx="171" cy="101" r="7" fill="#e6b456"/><circle cx="195" cy="101" r="7" fill="#77aa86"/>
    <text x="232" y="108" fill="#e9ddd4" font-family="Arial, sans-serif" font-size="17">编辑器设置 · OpenAI 兼容接口</text>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="158" y="184" fill="#3b2a20" font-size="25" font-weight="700">模型服务配置</text>
    <text x="158" y="218" fill="#806b5d" font-size="15">按目标站控制台提供的信息填写，下方内容仅为示例。</text>
    <g transform="translate(158 258)">
      <text fill="#6d584b" font-size="15" font-weight="700">API 地址</text>
      <rect y="16" width="716" height="54" rx="11" fill="#fff" stroke="#d9c7b7"/>
      <text x="18" y="50" fill="#825c43" font-family="Consolas, monospace" font-size="17">https://example.com/v1</text>
      <rect x="735" y="16" width="164" height="54" rx="11" fill="#fff2e5" stroke="#e5a16e"/>
      <text x="776" y="49" fill="#a84b20" font-size="16" font-weight="700">测试连接</text>
    </g>
    <g transform="translate(158 364)">
      <text fill="#6d584b" font-size="15" font-weight="700">API Key</text>
      <rect y="16" width="899" height="54" rx="11" fill="#fff" stroke="#d9c7b7"/>
      <text x="18" y="50" fill="#9a877a" font-family="Consolas, monospace" font-size="17">sk-••••••••••••••••••••••••</text>
    </g>
    <g transform="translate(158 470)">
      <text fill="#6d584b" font-size="15" font-weight="700">模型名称</text>
      <rect y="16" width="899" height="54" rx="11" fill="#fff" stroke="#d9c7b7"/>
      <text x="18" y="50" fill="#825c43" font-family="Consolas, monospace" font-size="17">请填写站点支持的模型名</text>
    </g>
    <rect x="845" y="575" width="212" height="46" rx="12" fill="#d76834"/>
    <text x="906" y="605" fill="#fff" font-size="16" font-weight="700">保存配置</text>
  </g>
</svg>
